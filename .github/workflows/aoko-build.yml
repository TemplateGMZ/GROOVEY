name: Compile Aoko modern Chest ESP DLL
on:
  push:
    branches: [aoko-chestesp-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Download pinned public Aoko source
        shell: pwsh
        run: |
          $url = "https://github.com/naczo5/aoko-client/archive/82c5830145ee9bc8dfa06faae87de4dae92c43b4.zip"
          Invoke-WebRequest -Uri $url -OutFile aoko-src.zip
          Expand-Archive aoko-src.zip -DestinationPath . -Force
          $root = (Get-ChildItem -Directory -Filter "aoko-client-*" | Select-Object -First 1).FullName
          if (-not $root) { throw "Aoko source not found" }
          Add-Content -Path $env:GITHUB_ENV -Value "AOKO_SOURCE=$root"
      - name: Apply improved Chest ESP
        shell: pwsh
        run: python aoko-build/patch_aoko.py "$env:AOKO_SOURCE"
      - name: Compile modern bridge under MSYS2
        shell: msys2 {0}
        run: |
          set -e
          SRC="$(cygpath -u "$AOKO_SOURCE")/McInjector"
          JAVA_HEADERS="$(cygpath -u "$JAVA_HOME")/include"
          cd "$SRC"
          g++ -m64 -std=c++11 -shared -DIMGUI_IMPL_VULKAN_NO_PROTOTYPES -o bridge_261.dll \
          src/main/cpp/bridge_261.cpp src/main/cpp/nick_hider_jvmti.cpp \
          src/main/cpp/anti_debuff_jvmti.cpp src/main/cpp/kill_aura_premotion.cpp \
          src/main/cpp/render_backend.cpp src/main/cpp/gl_loader.cpp \
          src/main/cpp/jni_core/resolver.cpp src/main/cpp/jni_core/helper_bridge.cpp \
          src/main/cpp/imgui/imgui.cpp src/main/cpp/imgui/imgui_draw.cpp \
          src/main/cpp/imgui/imgui_tables.cpp src/main/cpp/imgui/imgui_widgets.cpp \
          src/main/cpp/imgui/imgui_impl_win32.cpp src/main/cpp/imgui/imgui_impl_opengl3.cpp \
          src/main/cpp/imgui/imgui_impl_vulkan.cpp \
          src/main/cpp/imgui/minhook_src/buffer.c src/main/cpp/imgui/minhook_src/hook.c \
          src/main/cpp/imgui/minhook_src/trampoline.c src/main/cpp/imgui/minhook_src/hde/hde64.c \
          -I"$JAVA_HEADERS" -I"$JAVA_HEADERS/win32" \
          -Isrc/main/cpp -Isrc/main/cpp/imgui -Isrc/main/cpp/vulkan \
          -Isrc/main/cpp/imgui/minhook_src -Isrc/main/cpp/imgui/minhook_src/include \
          -lws2_32 -lopengl32 -lgdi32 -ldwmapi \
          -static -static-libgcc -static-libstdc++ -Wl,--add-stdcall-alias
          test -s bridge_261.dll
      - uses: actions/upload-artifact@v4
        with:
          name: aoko-chestesp-modern-dll
          path: aoko-client-*/McInjector/bridge_261.dll
          retention-days: 3
          if-no-files-found: error
